##############################################################################
# CI/CD Pipeline for Smart Campus Lost & Found System
# Author: Vikas Reddy Amanagantti (x25178849)
#
# Jobs:
#   1. test-library    -- Install & test the campusfinder library
#   2. test-backend    -- Install & test the Flask backend
#   3. build-frontend  -- Build the React frontend
#   4. deploy-backend  -- Deploy backend to Elastic Beanstalk (main branch)
#   5. deploy-frontend -- Sync build artefact to S3 static site (main branch)
##############################################################################

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  EB_APPLICATION: campus-lost-found-vikas
  EB_ENVIRONMENT: campus-lost-found-vikas-prod
  FRONTEND_BUCKET: campus-lost-found-vikas-frontend
  BACKEND_URL: http://campus-lost-found-vikas-prod.eba-vp5yhc3x.eu-west-1.elasticbeanstalk.com

jobs:
  # ------------------------------------------------------------------
  # Job 1: Test the campusfinder custom library
  # ------------------------------------------------------------------
  test-library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campusfinder
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install library in editable mode
        run: pip install -e ".[dev]"
      - name: Run library tests
        run: pytest tests/ -v --tb=short

  # ------------------------------------------------------------------
  # Job 2: Test the Flask backend
  # ------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    needs: test-library
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_ENV: testing
      USE_AWS: "False"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install campusfinder library (editable)
        run: pip install -e ../campusfinder
      - name: Install backend dependencies
        run: |
          grep -v "^campusfinder-vikasreddy" requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
      - name: Run backend tests
        run: pytest tests/ -v --tb=short

  # ------------------------------------------------------------------
  # Job 3: Build the React frontend
  # ------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    needs: test-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        env:
          CI: "false"
          REACT_APP_API_URL: http://campus-lost-found-vikas-prod.eba-vp5yhc3x.eu-west-1.elasticbeanstalk.com
        run: npm run build
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

  # ------------------------------------------------------------------
  # Job 4: Deploy backend to Elastic Beanstalk (main only)
  # ------------------------------------------------------------------
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EB CLI
        run: pip install awsebcli
      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_KEY }}
          EOF
          cat > ~/.aws/config <<EOF
          [default]
          region=eu-west-1
          EOF
      - name: Deploy to Elastic Beanstalk
        working-directory: backend
        run: |
          eb use ${{ env.EB_ENVIRONMENT }}
          eb deploy --timeout 20

  # ------------------------------------------------------------------
  # Job 5: Deploy frontend to S3 static site (main only)
  # ------------------------------------------------------------------
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: eu-west-1
      - name: Sync to S3
        run: aws s3 sync build/ s3://${{ env.FRONTEND_BUCKET }}/ --delete
